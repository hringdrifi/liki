      <stop stop-color="#1F2834"/>
      <stop offset="1" stop-color="#10151C"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E5EA"/>
